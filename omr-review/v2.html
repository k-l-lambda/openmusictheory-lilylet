<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OMT v2 核验</title>
	<link rel="stylesheet" href="review.css">
	<style>
		/* v2-only additions; everything else comes from review.css (shared with V1) */
		.tag-st-ok { background: var(--tag-hand-bg); color: var(--tag-hand-fg); }
		.tag-st-ok-with-notes { background: transparent; color: var(--warn-fg); border: 1px solid currentColor; }
		.tag-st-skipped, .tag-st-failed { background: var(--tag-none-bg); color: var(--tag-none-fg); }
		.tag-cat, .tag-kind { background: var(--tag-none-bg); color: var(--tag-none-fg); }
		.tag-rv-checked { background: var(--tag-omr-bg); color: var(--tag-omr-fg); }
		.pane-orig .paper { flex-direction: column; gap: 8px; }
		.page-cap { font-size: 11px; color: #76766f; align-self: flex-start; }
		.render-btn { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid #b9b9b0; background: #fff; color: #1e1e1c; cursor: pointer; }
		.render-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.notes-list { margin: 0; padding-left: 18px; color: var(--muted); }
		.notes-list:empty { display: none; }
	</style>
	<!-- Generated by `node omr-review/build.mjs --v2` (omr-review/build-v2.mjs) -->
	<script src="v2-data.js"></script>
	<script src="vendor/lilylet.bundle.js"></script>
	<script src="vendor/verovio-toolkit-wasm.js" defer></script>
	<script src="v2.js" defer></script>
</head>
<body>
	<header class="bar">
		<div class="bar-title">
			<h1>OMT 第二版 · lilylet 核验</h1>
			<p class="meta" id="meta">加载中…</p>
		</div>
		<form class="filters" id="filters" onsubmit="return false">
			<label class="field">
				<span>搜索</span>
				<input type="search" id="q" placeholder="文件名 / 路径 / 章节" autocomplete="off">
			</label>
			<label class="field">
				<span>来源</span>
				<select id="type">
					<option value="">全部</option>
					<option value="score">乐谱文件</option>
					<option value="image">图片转写</option>
				</select>
			</label>
			<label class="field">
				<span>类别</span>
				<select id="category"><option value="">全部类别</option></select>
			</label>
			<label class="field">
				<span>类型</span>
				<select id="kind"><option value="">全部类型</option></select>
			</label>
			<label class="field">
				<span>状态</span>
				<select id="status"><option value="">全部状态</option></select>
			</label>
			<label class="field">
				<span>核验</span>
				<select id="review">
					<option value="">全部</option>
					<option value="none">未核验</option>
					<option value="checked">已核验无误</option>
					<option value="issue">有问题</option>
				</select>
			</label>
		</form>
	</header>

	<p class="status-line" id="renderer" role="status" aria-live="polite">正在加载 Verovio…</p>

	<main id="list" class="list" aria-label="曲谱对照列表"></main>
	<p class="empty" id="empty" hidden>没有匹配的条目。</p>

	<template id="card-tpl">
		<article class="card">
			<header class="card-head">
				<h2 class="card-name"></h2>
				<span class="tags"></span>
				<span class="path"></span>
			</header>
			<div class="panes">
				<figure class="pane pane-orig">
					<figcaption class="orig-cap">MuseScore 渲染（源文件）</figcaption>
					<div class="paper orig"></div>
				</figure>
				<figure class="pane pane-render">
					<figcaption>
						<span class="cap-text">lilylet 渲染</span>
						<a class="copy-path" hidden></a>
						<span class="copy-status" role="status" aria-live="polite"></span>
					</figcaption>
					<div class="paper render" aria-live="polite"></div>
				</figure>
			</div>
			<details class="more">
				<summary>详情</summary>
				<div class="more-body">
					<p class="pages"></p>
					<ul class="notes-list"></ul>
					<ul class="warnings"></ul>
					<pre class="code"></pre>
				</div>
			</details>
		</article>
	</template>
</body>
</html>
