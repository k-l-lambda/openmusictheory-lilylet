<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OMR 核验</title>
	<link rel="stylesheet" href="review.css">
	<!-- Generated by `npm run omr-review` (omr-review/build.mjs) -->
	<script src="data.js"></script>
	<script src="vendor/lilylet.bundle.js"></script>
	<script src="vendor/verovio-toolkit-wasm.js" defer></script>
	<script src="review.js" defer></script>
</head>
<body>
	<header class="bar">
		<div class="bar-title">
			<h1>OMR 核验</h1>
			<p class="meta" id="meta">加载中…</p>
		</div>
		<form class="filters" id="filters" onsubmit="return false">
			<label class="field">
				<span>搜索</span>
				<input type="search" id="q" placeholder="文件名 / 路径 / 页面" autocomplete="off">
			</label>
			<label class="field">
				<span>状态</span>
				<select id="status">
					<option value="all">全部</option>
					<option value="lyl">已有 lilylet</option>
					<option value="omr">OMR 生成</option>
					<option value="hand">手工编写</option>
					<option value="none">尚无 lilylet</option>
				</select>
			</label>
			<label class="field">
				<span>目录</span>
				<select id="dir"><option value="">全部目录</option></select>
			</label>
			<label class="field check">
				<input type="checkbox" id="hideDiagrams">
				<span>隐藏 SVG 示意图</span>
			</label>
		</form>
	</header>

	<p class="status-line" id="renderer" role="status" aria-live="polite">正在加载 Verovio…</p>

	<main id="list" class="list" aria-label="曲谱对照列表"></main>
	<p class="empty" id="empty" hidden>没有匹配的图片。</p>

	<template id="card-tpl">
		<article class="card">
			<header class="card-head">
				<h2 class="card-name"></h2>
				<span class="tags"></span>
				<span class="path"></span>
			</header>
			<div class="panes">
				<figure class="pane pane-orig">
					<figcaption>原图</figcaption>
					<div class="paper"><img loading="lazy" decoding="async"></div>
				</figure>
				<figure class="pane pane-render">
					<figcaption>
						<span class="cap-text">lilylet 渲染</span>
						<a class="copy-path" hidden></a>
						<span class="copy-status" role="status" aria-live="polite"></span>
					</figcaption>
					<div class="paper render" aria-live="polite"></div>
				</figure>
			</div>
			<details class="more">
				<summary>详情</summary>
				<div class="more-body">
					<p class="pages"></p>
					<ul class="warnings"></ul>
					<pre class="code"></pre>
				</div>
			</details>
		</article>
	</template>
</body>
</html>
